name: Deploy CloudTrail trail

permissions:
  actions: read
  statuses: read
  id-token: write
  contents: read
  security-events: write

# Workflow triggers
on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: Select the environment
        default: prod
        options:
          - prod
          - nonprod
      action:
        description: "Action to perform - apply, dry-run, destroy, or cleanup"
        required: true
        type: choice
        default: apply
        options:
          - apply
          - dry-run
          - destroy
          - cleanup

env:
  STACK_NAME: org-mgmt-cloudtrail-stack
  TEMPLATE_FILE: cloudformation/cloudtrail.yaml


jobs:
  deploy:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🚀 Deployment Configuration
        run: |
          echo "=========================================================="
          echo "         CLOUDTRAIL DEPLOYMENT CONFIGURATION"
          echo "=========================================================="
          echo "  Environment: ${{ github.event.inputs.environment }}"
          echo "  Action:      ${{ github.event.inputs.action }}"
          echo "  Stack:       ${{ env.STACK_NAME }}"
          echo "  Region:      ${{ vars.AWS_REGION }}"
          echo "=========================================================="
          

          echo "## 🎯 Deployment Configuration"                                   >> $GITHUB_STEP_SUMMARY
          echo ""                                                                 >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |"                                            >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|"                                            >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | \`${{ github.event.inputs.action }}\` |"           >> $GITHUB_STEP_SUMMARY
          echo "| **Stack** | \`${{ env.STACK_NAME }}\` |"                        >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ vars.AWS_REGION }}\` |"                      >> $GITHUB_STEP_SUMMARY
          echo ""                                                                 >> $GITHUB_STEP_SUMMARY

      - name: Determine deployment environment
        run: |
          ./scripts/determine-environment.sh \
            "${{ github.event.inputs.environment }}" \
            "${{ github.workspace }}"

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-OIDC-Session

      # Assume CICD role using the OIDC role credentials
      - name: Configure AWS Credentials (CICD Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CICD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-CICD-Session
          role-chaining: true

      # -------------------------------------------------------
      # Validate the CloudFormation template
      # -------------------------------------------------------
      - name: Validate CloudFormation template
        run: |
          ./scripts/validate-template.sh \
            "${{ github.workspace }}" \
            "${{ env.TEMPLATE_FILE }}"

      # -------------------------------------------------------
      # Preflight checks for referenced resources
      # -------------------------------------------------------
      - name: Preflight checks (apply/dry-run)
        if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'dry-run'
        run: |
          ./scripts/preflight-checks.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}" \
            "${{ github.workspace }}" \
            "${{ env.PARAMS_FILE }}"

      # -------------------------------------------------------
      # Dry-run path (preview changes only)
      # -------------------------------------------------------
      - name: Preview CloudFormation changes (dry-run)
        if: github.event.inputs.action == 'dry-run'
        env:
          CHANGE_SET_NAME: dry-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./scripts/dry-run.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}" \
            "${{ github.workspace }}" \
            "${{ env.TEMPLATE_FILE }}" \
            "${{ env.PARAMS_FILE }}" \
            "${{ env.ENV_KEY }}" \
            "${CHANGE_SET_NAME}"

      - name: Cleanup dry-run change set
        if: github.event.inputs.action == 'dry-run' && always()
        env:
          CHANGE_SET_NAME: dry-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./scripts/cleanup-changeset.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}" \
            "${CHANGE_SET_NAME}"

      # -------------------------------------------------------
      # Deploy (apply) path
      # -------------------------------------------------------
      - name: Deploy CloudFormation stack
        if: github.event.inputs.action == 'apply'
        run: |
          ./scripts/deploy-stack.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}" \
            "${{ github.workspace }}" \
            "${{ env.TEMPLATE_FILE }}" \
            "${{ env.PARAMS_FILE }}" \
            "${{ env.ENV_KEY }}"

      - name: Dump CloudFormation stack events on failure
        if: github.event.inputs.action == 'apply' && failure()
        run: |
          ./scripts/dump-stack-events.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}"

      - name: Show stack outputs
        if: github.event.inputs.action == 'apply'
        run: |
          ./scripts/show-stack-outputs.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}"

      # -------------------------------------------------------
      # Verify trail was created correctly
      # -------------------------------------------------------
      - name: Verify CloudTrail trail exists
        if: github.event.inputs.action == 'apply'
        run: |
          ./scripts/verify-trail-exists.sh \
            "org-mgmt-cloudtrail" \
            "${{ vars.AWS_REGION }}"

      - name: Verify CloudTrail is logging
        if: github.event.inputs.action == 'apply'
        run: |
          ./scripts/verify-trail-logging.sh \
            "org-mgmt-cloudtrail" \
            "${{ vars.AWS_REGION }}"

      - name: Verify trail configuration
        if: github.event.inputs.action == 'apply'
        run: |
          ./scripts/verify-trail-configuration.sh \
            "org-mgmt-cloudtrail" \
            "${{ vars.AWS_REGION }}" \
            "org-mgmt-cloudtrail-logs-alexorg-remote"

      # -------------------------------------------------------
      # Destroy path
      # -------------------------------------------------------
      - name: Delete CloudFormation stack
        if: github.event.inputs.action == 'destroy'
        run: |
          ./scripts/delete-stack.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}"

      # -------------------------------------------------------
      # Clean up all change sets and stack
      # -------------------------------------------------------
      - name: Clean up all change sets and stack
        if: github.event.inputs.action == 'cleanup'
        run: |
          ./scripts/cleanup-all.sh \
            "${{ env.STACK_NAME }}" \
            "${{ vars.AWS_REGION }}"
